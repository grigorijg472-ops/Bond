<div class="title"><h1>Аквариум</h1><p>Пресноводный травник · 5 видов рыб</p></div>
<div class="fishname" id="fishname"></div>
<div class="bar">
  <button id="btnFeed" type="button">🍤 Покормить</button>
  <button id="btnLight" type="button">🌙 Ночь</button>
  <button id="btnBack" type="button" hidden>↩ Обзор</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>(() => {
'use strict';
const T = THREE;
// ---------- utilities ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261031);
const R = (a,b)=>a+(b-a)*rnd();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function hash3(x,y,z){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1440662683);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);let xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const l=(a,b,t)=>a+(b-a)*t;
  return l(l(l(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),l(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
           l(l(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),l(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z,o=4){let a=0.5,f=1,s=0;for(let i=0;i<o;i++){s+=a*(vnoise(x*f,y*f,z*f)*2-1);f*=2.03;a*=0.5;}return s;}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function texFromCanvas(c,srgb=true,rep){const t=new T.CanvasTexture(c);if(srgb)t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
function paintCanvas(w,h,fn,alpha=false){const c=canvas(w,h),ctx=c.getContext('2d'),img=ctx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const r=fn((x+0.5)/w,1-(y+0.5)/h);const i=(y*w+x)*4;
    d[i]=clamp(r[0],0,1)*255;d[i+1]=clamp(r[1],0,1)*255;d[i+2]=clamp(r[2],0,1)*255;d[i+3]=alpha?clamp(r[3],0,1)*255:255;}
  ctx.putImageData(img,0,0);return c;}
// merge duplicate vertices of a non-indexed position-only geometry
function mergeVerts(g){const p=g.attributes.position.array,map=new Map(),pos=[],idx=[];
  for(let i=0;i<p.length;i+=3){const k=Math.round(p[i]*1e4)+','+Math.round(p[i+1]*1e4)+','+Math.round(p[i+2]*1e4);
    let id=map.get(k);if(id===undefined){id=pos.length/3;map.set(k,id);pos.push(p[i],p[i+1],p[i+2]);}idx.push(id);}
  const ng=new T.BufferGeometry();ng.setAttribute('position',new T.Float32BufferAttribute(pos,3));ng.setIndex(idx);return ng;}

// ---------- tank dimensions ----------
const TW=100, TD=45, TH=55, SURF=50;
const HX=TW/2, HZ=TD/2;
function floorY(x,z){
  const back=Math.pow(clamp((HZ-z)/TD,0,1),1.6);
  return 1.2+6.5*back+0.7*Math.sin(x*0.13+z*0.09)*Math.cos(z*0.2-x*0.05)+0.35*Math.sin(x*0.45)*Math.sin(z*0.41)+0.5*fbm(x*0.06,z*0.06,3.1,3);
}

// ---------- shared shader uniforms ----------
const G={
  uTime:{value:0}, uBoxMin:{value:new T.Vector3(-HX+0.3,-1,-HZ+0.3)}, uBoxMax:{value:new T.Vector3(HX-0.3,SURF,HZ-0.3)},
  uWaterColor:{value:new T.Color(0.01,0.05,0.06)}, uWaterDensity:{value:0.012}, uCaus:{value:1.0},
  uCausColor:{value:new T.Color(1.0,0.97,0.88)}, uSurfY:{value:SURF}
};
const V_HEAD=`
uniform float uTime; varying vec3 vWPos;
`;
const BEND_HEAD=`
uniform float uPhase; uniform float uAmp; uniform float uTurn; uniform float uLen; uniform float uNose;
float bendX(float z){ float t=clamp((uNose-z)/uLen,0.0,1.7); float g=0.025+0.2*t*t;
  return uLen*(uAmp*g*sin(uPhase-t*4.4)+uTurn*t*t*0.22); }
`;
const SWAY_HEAD=`
uniform float uSwayAmp; uniform float uSwayH; uniform float uSwayBase;
`;
const F_HEAD=`
uniform float uTime; uniform vec3 uBoxMin; uniform vec3 uBoxMax; uniform vec3 uWaterColor; uniform float uWaterDensity;
uniform float uCaus; uniform vec3 uCausColor; uniform float uSurfY; uniform float uMatCaus;
varying vec3 vWPos;
float causticF(vec2 uv, float time){
  vec2 p = mod(uv*6.28318530718, 6.28318530718) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float t = time * (1.0 - (3.5 / float(n+1)));
    i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
    c += 1.0/length(vec2(p.x / (sin(i.x+t)/inten), p.y / (cos(i.y+t)/inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 1.5);
}
float waterDist(vec3 p){
  vec3 ro = cameraPosition; vec3 rd = p - ro; float len = length(rd); rd = rd/len + vec3(1e-5);
  vec3 inv = 1.0/rd; vec3 t0=(uBoxMin-ro)*inv; vec3 t1=(uBoxMax-ro)*inv; vec3 tm=min(t0,t1);
  float tn = max(max(max(tm.x,tm.y),tm.z),0.0);
  return max(len-tn,0.0);
}
`;
const F_BODY=`
#include <opaque_fragment>
{
  vec3 wN = inverseTransformDirection(normal, viewMatrix);
  float up = clamp(wN.y*0.75+0.25,0.0,1.0);
  vec2 cuv = vWPos.xz*0.045 + vec2(vWPos.y*0.012);
  float cs = 0.6*causticF(cuv, uTime*0.42) + 0.6*causticF(cuv*1.41+vec2(0.37,0.11), uTime*0.33+3.0);
  float depthFade = exp(-max(uSurfY - vWPos.y,0.0)*0.018);
  gl_FragColor.rgb += diffuseColor.rgb * uCausColor * cs * uCaus * uMatCaus * up * (0.35+0.65*depthFade);
  gl_FragColor.rgb *= mix(vec3(0.5,0.72,0.78), vec3(1.0), exp(-max(uSurfY - vWPos.y,0.0)*0.02));
  float f = 1.0 - exp(-waterDist(vWPos)*uWaterDensity);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterColor, f);
}
`;
function enhance(mat,o={}){
  const key='aq'+(o.bend?'-b':'')+(o.sway?'-s':'')+(o.swayInst?'-i':'');
  const local={uMatCaus:{value:o.caus??0.6}};
  if(o.sway)Object.assign(local,{uSwayAmp:{value:o.sway.amp},uSwayH:{value:o.sway.h},uSwayBase:{value:o.sway.base||0}});
  mat.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,G,local,o.bend||{});
    let vs=sh.vertexShader;
    vs=vs.replace('#include <common>','#include <common>\n'+(o.swayInst?'#define SWAY_INST\n':'')+V_HEAD+(o.bend?BEND_HEAD:'')+(o.sway?SWAY_HEAD:''));
    if(o.bend){
      vs=vs.replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
      { float e=0.01*uLen; float sl=(bendX(position.z+e)-bendX(position.z-e))/(2.0*e); objectNormal.z-=objectNormal.x*sl; objectNormal=normalize(objectNormal); }`);
      vs=vs.replace('#include <begin_vertex>','#include <begin_vertex>\n transformed.x += bendX(position.z);');
    }
    if(o.sway){
      vs=vs.replace('#include <project_vertex>',`
      vec4 wpos = vec4(transformed,1.0);
      #ifdef USE_INSTANCING
        wpos = instanceMatrix * wpos;
      #endif
      wpos = modelMatrix * wpos;
      #if defined(SWAY_INST) && defined(USE_INSTANCING)
        float baseY = (modelMatrix * vec4(instanceMatrix[3].xyz,1.0)).y;
      #else
        float baseY = uSwayBase;
      #endif
      float hh = max(wpos.y-baseY,0.0)/uSwayH; float kk = hh*hh;
      vec2 dir = vec2(sin(uTime*0.62+wpos.x*0.045)*0.8+sin(uTime*1.7+wpos.z*0.3+wpos.x*0.21)*0.32,
                      cos(uTime*0.47+wpos.z*0.06)*0.45+sin(uTime*1.25+wpos.x*0.23)*0.22);
      wpos.xz += dir*uSwayAmp*kk;
      vWPos = wpos.xyz;
      vec4 mvPosition = viewMatrix * wpos;
      gl_Position = projectionMatrix * mvPosition;`);
    } else {
      vs=vs.replace('#include <project_vertex>',`#include <project_vertex>
      { vec4 wp=vec4(transformed,1.0);
        #ifdef USE_INSTANCING
          wp = instanceMatrix*wp;
        #endif
        vWPos=(modelMatrix*wp).xyz; }`);
    }
    sh.vertexShader=vs;
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+F_HEAD).replace('#include <opaque_fragment>',F_BODY);
  };
  mat.customProgramCacheKey=()=>key;
  mat.userData.local=local;
  return mat;
}

// ---------- renderer / scene ----------
const cv=document.getElementById('gl');
const renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
scene.background=new T.Color(0x05080b);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,0.1,1000);

// environment for reflections
{
  const env=new T.Scene();
  const sky=new T.Mesh(new T.SphereGeometry(50,32,16),new T.ShaderMaterial({side:T.BackSide,uniforms:{},
    vertexShader:'varying vec3 vP; void main(){vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec3 vP; void main(){ float y=vP.y; vec3 c=mix(vec3(0.09,0.09,0.075), vec3(0.12,0.2,0.22), smoothstep(-0.4,0.3,y)); c=mix(c, vec3(1.2,1.25,1.2), smoothstep(0.55,1.0,y)); c*=vec3(0.85,0.9,0.9); gl_FragColor=vec4(c,1.0);}'}));
  env.add(sky);
  const panel=new T.Mesh(new T.PlaneGeometry(40,6),new T.MeshBasicMaterial({color:new T.Color(6,6,5.5)}));
  panel.position.set(0,30,0);panel.rotation.x=Math.PI/2;env.add(panel);
  const side=new T.Mesh(new T.PlaneGeometry(30,10),new T.MeshBasicMaterial({color:new T.Color(0.6,0.8,0.9)}));
  side.position.set(-35,10,20);side.lookAt(0,0,0);env.add(side);
  const pm=new T.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,0.03).texture;
}

// lights
const hemi=new T.HemisphereLight(0xbfe0f0,0x8a8068,0.9);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff4e0,3.2);
sun.position.set(18,140,30);sun.target.position.set(0,0,0);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-58,right:58,top:40,bottom:-40,near:60,far:200});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.04;sun.shadow.radius=3;
const fill=new T.DirectionalLight(0x8fd0ff,0.5);fill.position.set(-40,30,80);scene.add(fill);
const bounce=new T.DirectionalLight(0xffe6c0,0.7);bounce.position.set(10,-60,20);scene.add(bounce);
// ---------- tank, glass, cabinet ----------
const blackMat=new T.MeshStandardMaterial({color:0x0b0c0d,roughness:0.55,metalness:0.3});
function box(w,h,d,mat,x,y,z){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m;}
// cabinet
{
  const woodC=paintCanvas(512,512,(u,v)=>{const g=fbm(u*3,v*40,1,4);const s=0.5+0.5*Math.sin((u*14+g*3)*Math.PI);
    const b=0.07+0.025*s+0.02*g;return [b*1.15,b*0.95,b*0.8];});
  const cab=new T.MeshStandardMaterial({map:texFromCanvas(woodC,true,[2,1]),roughness:0.6,metalness:0.0});
  box(TW+6,34,TD+7,cab,0,-2.8-17,0).receiveShadow=true;
  box(TW+7,1.2,TD+8,blackMat,0,-2.6,0);
}
// tank bottom glass + frame rims
box(TW,0.8,TD,new T.MeshStandardMaterial({color:0x0f2a26,roughness:0.2}),0,-1.6,0);
for(const y of [-1.6,TH-0.6]){
  box(TW+1.2,1.4,0.9,blackMat,0,y,HZ+0.15);box(TW+1.2,1.4,0.9,blackMat,0,y,-HZ-0.15);
  box(0.9,1.4,TD+1.2,blackMat,HX+0.15,y,0);box(0.9,1.4,TD+1.2,blackMat,-HX-0.15,y,0);
}
// glass panels (additive => only reflections and a faint tint)
const glassMat=new T.MeshPhysicalMaterial({color:0x000000,roughness:0.03,metalness:0,clearcoat:1,clearcoatRoughness:0.02,
  envMapIntensity:0.45,transparent:true,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide});
const glassTint=new T.MeshBasicMaterial({color:0x2c6a62,transparent:true,opacity:0.05,depthWrite:false,side:T.DoubleSide});
const panels=[[TW,TH,0.5,0,TH/2-1.2,HZ],[TW,TH,0.5,0,TH/2-1.2,-HZ],[0.5,TH,TD,HX,TH/2-1.2,0],[0.5,TH,TD,-HX,TH/2-1.2,0]];
for(const p of panels){const g=box(p[0],p[1],p[2],glassMat,p[3],p[4],p[5]);g.renderOrder=10;
  const t=box(p[0],p[1],p[2],glassTint,p[3],p[4],p[5]);t.renderOrder=9;}
// green glass edges
const edgeMat=new T.MeshStandardMaterial({color:0x5fb3a0,roughness:0.1,transparent:true,opacity:0.35,depthWrite:false});
for(const sx of [-1,1])for(const sz of [-1,1]){const e=box(0.7,TH-1,0.7,edgeMat,sx*HX,TH/2-1.2,sz*HZ);e.renderOrder=8;}
// light hood
{
  const hood=box(TW-4,1.6,9,blackMat,0,TH+1.6,0);
  const led=new T.Mesh(new T.PlaneGeometry(TW-10,1.5),new T.MeshBasicMaterial({color:new T.Color(2.2,2.2,2.0)}));
  led.rotation.x=Math.PI/2;led.position.set(0,TH+0.75,0);scene.add(led);
  window.__led=led;
  for(const sx of [-1,1]){box(1.2,1.8,1.2,blackMat,sx*(HX-6),TH+0.2,0);}
}

// ---------- back panel ----------
{
  const c=paintCanvas(512,256,(u,v)=>{const n=fbm(u*6,v*3,7,4);const b=0.02+0.06*Math.pow(v,1.6)+0.012*n;return [b*0.6,b*1.25,b*1.35];});
  const m=enhance(new T.MeshStandardMaterial({map:texFromCanvas(c),roughness:1}),{caus:0});
  const bp=new T.Mesh(new T.PlaneGeometry(TW-0.6,TH-1),m);bp.position.set(0,TH/2-1.5,-HZ+0.45);scene.add(bp);
}

// ---------- sand ----------
const sandMat=(()=>{
  const S=1024;
  const col=paintCanvas(S,S,(u,v)=>{const n=fbm(u*40,v*40,1,3);const g=hash3(u*S|0,v*S|0,7);const g2=hash3(u*S|0,v*S|0,9);
    let c=[0.78,0.68,0.52];c=mix(c,[0.62,0.52,0.38],0.5+0.5*n);
    if(g>0.93)c=mix(c,[0.95,0.92,0.85],0.7);else if(g>0.86)c=mix(c,[0.42,0.34,0.26],0.6);else if(g2>0.97)c=[0.25,0.22,0.2];
    const k=0.9+0.2*hash3(u*S/2|0,v*S/2|0,3);return [c[0]*k,c[1]*k,c[2]*k];});

  const irisM=enhance(new T.MeshPhysicalMaterial({color:new T.Color(...sp.iris),metalness:0.6,roughness:0.25,clearcoat:1}),{bend:U,caus:0});
  const pupM=enhance(new T.MeshPhysicalMaterial({color:0x020202,roughness:0.05,clearcoat:1,clearcoatRoughness:0.02,envMapIntensity:2}),{bend:U,caus:0});
  for(const g of A.irisG)grp.add(new T.Mesh(g,irisM));for(const g of A.pupG)grp.add(new T.Mesh(g,pupM));
  const pm=new T.MeshPhysicalMaterial({map:A.ft.pect,transparent:true,side:T.DoubleSide,depthWrite:false,roughness:0.45});enhance(pm,{caus:0});
  const pects=[];for(const s of [1,-1]){const m=new T.Mesh(A.pg,pm);m.position.set(s*A.pectPos[2],A.pectPos[1],A.pectPos[0]);m.userData.s=s;m.renderOrder=2;grp.add(m);pects.push(m);}
  const s=R(0.85,1.12);grp.scale.setScalar(s);
  const f={sp,key,grp,U,pects,body,size:sp.L*s,pos:new T.Vector3(),vel:new T.Vector3(),target:new T.Vector3(),
    off:new T.Vector3(R(-5,5),R(-2.5,2.5),R(-4,4)),cruise:R(sp.speed[0],sp.speed[1]),rest:0,dirPrev:new T.Vector3(0,0,1),turn:0,phase:R(0,6)};
  const y0=sp.bottom?0:R(sp.yr[0],sp.yr[1]);f.pos.set(R(-35,35),y0,R(-12,12));if(sp.bottom)f.pos.y=floorY(f.pos.x,f.pos.z)+1.3;
  f.vel.set(R(-1,1),0,R(-1,1)).setLength(f.cruise);pickTarget(f);grp.position.copy(f.pos);
  body.userData.fish=f;bodies.push(body);scene.add(grp);fishes.push(f);return f;}
function pickTarget(f){const sp=f.sp;
  if(sp.bottom){const x=R(-40,40),z=R(-8,18);f.target.set(x,floorY(x,z)+R(1.0,2.2),z);return;}
  f.target.set(R(BMIN.x,BMAX.x),R(sp.yr[0],sp.yr[1]),R(BMIN.z,BMAX.z));}
for(const k in SPECIES)for(let i=0;i<SPECIES[k].count;i++)makeFish(k);
const school={p:new T.Vector3(0,18,0),t:new T.Vector3(10,18,0)};

const food=[];
const foodGeo=new T.PlaneGeometry(0.5,0.4);
const foodMat=enhance(new T.MeshStandardMaterial({color:0xc8762f,roughness:0.8,side:T.DoubleSide}),{caus:0.3});
function feed(){const cx=R(-25,25),cz=R(-8,8);for(let i=0;i<26;i++){const m=new T.Mesh(foodGeo,foodMat);m.position.set(cx+R(-6,6),SURF-0.3,cz+R(-4,4));
  m.rotation.set(R(0,6),R(0,6),R(0,6));scene.add(m);food.push({m,vy:R(-1.6,-0.9),w:R(0,6),settled:false});}}

const tmpV=new T.Vector3(),tmpV2=new T.Vector3(),desired=new T.Vector3(),dummy=new T.Object3D(),tq=new T.Quaternion();
function updateFish(dt,time){
  // school leader
  if(school.p.distanceTo(school.t)<6)school.t.set(R(-38,38),R(8,28),R(-12,14));
  tmpV.subVectors(school.t,school.p).setLength(4.5*dt);school.p.add(tmpV);
  for(const f of fishes){const sp=f.sp;
    let target=f.target,speed=f.cruise;let eating=null;
    // food seeking
    if(food.length){let best=null,bd=sp.bottom?60:45;for(const fd of food){const ok=sp.bottom?(fd.settled||fd.m.position.y<9):!fd.settled;if(!ok)continue;const d=fd.m.position.distanceTo(f.pos);if(d<bd){bd=d;best=fd;}}
      if(best){target=best.m.position;speed=sp.speed[1]*1.4;eating=best;}}
    if(!eating){
      if(f.key==='neon'){tmpV2.copy(school.p).add(f.off);target=tmpV2;speed=f.cruise+Math.min(f.pos.distanceTo(tmpV2)*0.4,4);}
      else if(f.pos.distanceTo(f.target)<4){pickTarget(f);if(sp.bottom)f.rest=R(1.5,5);}
    }
    if(f.rest>0&&!eating){f.rest-=dt;speed=0.15;}
    desired.subVectors(target,f.pos);const dist=desired.length();desired.setLength(Math.min(speed,dist*1.5+0.3));
    // separation
    for(const o of fishes){if(o===f)continue;tmpV.subVectors(f.pos,o.pos);const d=tmpV.length();const r=(f.size+o.size)*0.55+0.6;
      if(d<r&&d>1e-4)desired.addScaledVector(tmpV,(r-d)/d*2.5);}
    // rocks
    for(const r of rocks){if(sp.bottom)break;tmpV.subVectors(f.pos,r.c);const d=tmpV.length();const rr=r.r+f.size*0.6;if(d<rr)desired.addScaledVector(tmpV,(rr-d)/d*3);}
    // walls
    const m=f.size*0.8;
    if(f.pos.x<BMIN.x+m)desired.x+=(BMIN.x+m-f.pos.x)*2;if(f.pos.x>BMAX.x-m)desired.x-=(f.pos.x-BMAX.x+m)*2;
    if(f.pos.z<BMIN.z+m*0.5)desired.z+=(BMIN.z+m*0.5-f.pos.z)*2;if(f.pos.z>BMAX.z-m*0.5)desired.z-=(f.pos.z-BMAX.z+m*0.5)*2;
    const fy=floorY(f.pos.x,f.pos.z)+(sp.bottom?0.9:f.size*0.45+1.5);if(f.pos.y<fy)desired.y+=(fy-f.pos.y)*3;
    if(f.pos.y>BMAX.y-sp.H*0.4)desired.y-=(f.pos.y-BMAX.y+sp.H*0.4)*3;
    const k=1-Math.exp(-dt*(eating?2.6:1.5));f.vel.lerp(desired,k);
    const hs=Math.hypot(f.vel.x,f.vel.z);f.vel.y=clamp(f.vel.y,-hs*0.6-0.3,hs*0.6+0.3);
    const sp2=f.vel.length();if(sp2>sp.speed[1]*1.6)f.vel.setLength(sp.speed[1]*1.6);
    f.pos.addScaledVector(f.vel,dt);
    f.pos.x=clamp(f.pos.x,-HX+2,HX-2);f.pos.z=clamp(f.pos.z,-HZ+2,HZ-2);f.pos.y=clamp(f.pos.y,floorY(f.pos.x,f.pos.z)+0.6,SURF-1.2);
    if(eating&&f.pos.distanceTo(eating.m.position)<f.size*0.45){scene.remove(eating.m);food.splice(food.indexOf(eating),1);}
    // orientation
    const s=f.vel.length();
    if(s>0.12){tmpV.copy(f.vel).normalize();const tdir=tmpV;
      const w=(f.dirPrev.z*tdir.x-f.dirPrev.x*tdir.z)/Math.max(dt,1e-3);f.turn+=(clamp(w*0.35,-1.2,1.2)-f.turn)*(1-Math.exp(-dt*4));f.dirPrev.copy(tdir);
      dummy.position.copy(f.pos);dummy.lookAt(tmpV2.copy(f.pos).add(tdir));dummy.rotateZ(-f.turn*0.25);tq.copy(dummy.quaternion);
      f.grp.quaternion.slerp(tq,1-Math.exp(-dt*6));}
    f.grp.position.copy(f.pos);
    const sr=clamp(s/sp.speed[1],0,1.8);
    const freq=(2.2+sr*7.5)*(6/(f.sp.L+2)+0.5);f.phase+=dt*freq;
    f.U.uPhase.value=f.phase;f.U.uAmp.value=0.35+0.55*Math.min(sr,1.4);f.U.uTurn.value=f.turn;
    const flap=Math.sin(time*(s<1?9:5)+f.phase*0.3)*(s<1?0.45:0.2);
    for(const p of f.pects){p.rotation.set(0.25,-p.userData.s*(0.55+flap),p.userData.s*0.35);}
  }
}

// ---------- bubbles ----------
const bubbles=[];let bubbleMesh;
{
  const bg=new T.SphereGeometry(1,14,10);
  const bm=new T.MeshPhysicalMaterial({color:0xdff4ff,metalness:0.85,roughness:0.03,transparent:true,opacity:0.55,envMapIntensity:2.2,depthWrite:false});
  const N=180;bubbleMesh=new T.InstancedMesh(bg,bm,N);bubbleMesh.renderOrder=3;bubbleMesh.frustumCulled=false;
  const sx=40,sz=-17;const sy=floorY(sx,sz);
  const stone=new T.Mesh(new T.CylinderGeometry(1.3,1.5,1.4,24),enhance(new T.MeshStandardMaterial({color:0x6d7276,roughness:0.95}),{caus:0.5}));
  stone.position.set(sx,sy+0.4,sz);scene.add(stone);
  for(let i=0;i<N;i++)bubbles.push({x:sx,z:sz,y:sy+R(0,SURF-sy),r:R(0.08,0.32),v:R(7,13),ph:R(0,6),ox:R(-0.9,0.9),oz:R(-0.9,0.9),base:sy+0.9});
  scene.add(bubbleMesh);
}
function updateBubbles(dt,time){for(let i=0;i<bubbles.length;i++){const b=bubbles[i];b.y+=b.v*dt*(0.7+0.3*b.r/0.3);
  if(b.y>SURF-0.2){b.y=b.base;b.ox=R(-0.6,0.6);b.oz=R(-0.6,0.6);}
  const k=(b.y-b.base)*0.03;const x=b.x+b.ox*(1+k*3)+Math.sin(time*6+b.ph+b.y*0.6)*0.25*(0.3+k);const z=b.z+b.oz*(1+k*3)+Math.cos(time*5+b.ph)*0.2*(0.3+k);
  sc3.set(b.r,b.r*0.85,b.r);ps3.set(x,b.y,z);qq.identity();m4.compose(ps3,qq,sc3);bubbleMesh.setMatrixAt(i,m4);}
  bubbleMesh.instanceMatrix.needsUpdate=true;}

// ---------- floating particles ----------
let motes;
{const N=900,p=new Float32Array(N*3);for(let i=0;i<N;i++){p[i*3]=R(-HX+1,HX-1);p[i*3+1]=R(2,SURF-1);p[i*3+2]=R(-HZ+1,HZ-1);}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));
  const c=paintCanvas(32,32,(u,v)=>{const d=Math.hypot(u-0.5,v-0.5)*2;return [1,1,1,Math.pow(clamp(1-d,0,1),2)];},true);
  motes=new T.Points(g,new T.PointsMaterial({size:0.22,map:texFromCanvas(c),transparent:true,opacity:0.45,depthWrite:false,color:0xcfe8e0,sizeAttenuation:true}));
  motes.renderOrder=4;scene.add(motes);}
function updateMotes(dt,time){const p=motes.geometry.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  x+=Math.sin(time*0.3+i)*0.15*dt+0.08*dt;y+=Math.sin(time*0.5+i*1.7)*0.12*dt-0.03*dt;z+=Math.cos(time*0.27+i*0.7)*0.1*dt;
  if(x>HX-1)x=-HX+1;if(y<1)y=SURF-1;p.setXYZ(i,x,y,z);}p.needsUpdate=true;}

// ---------- light rays ----------
const rays=[];
{const c=paintCanvas(128,256,(u,v)=>{const e=Math.pow(Math.sin(Math.PI*u),2.2);const n=0.6+0.4*vnoise(u*9,0,2);return [1,1,1,e*Math.pow(v,1.6)*n];},true);
  const tex=texFromCanvas(c);
  for(let i=0;i<7;i++){const w=R(5,12);const m=new T.Mesh(new T.PlaneGeometry(w,SURF),new T.MeshBasicMaterial({map:tex,color:0xcff6ff,transparent:true,opacity:0.06,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));
    m.position.set(R(-38,38),SURF/2,R(-14,12));m.userData={ph:R(0,6),base:R(0.05,0.11),tilt:R(-0.18,0.05)};m.renderOrder=5;scene.add(m);rays.push(m);}}

// ---------- water surface ----------
let surface;
{const S=256;const c=paintCanvas(S,S,(u,v)=>{const e=1/S;const h=(x,y)=>fbm(x*6,y*6,1,4);const dx=h(u+e,v)-h(u-e,v),dy=h(u,v+e)-h(u,v-e);
    return [0.5-dx*14,0.5-dy*14,1];});const nt=texFromCanvas(c,false,[4,2]);
  const mat=new T.MeshPhysicalMaterial({color:0x6fb3b0,roughness:0.04,metalness:0,transparent:true,opacity:0.32,normalMap:nt,normalScale:new T.Vector2(0.6,0.6),envMapIntensity:1.4,side:T.DoubleSide,depthWrite:false});
  surface=new T.Mesh(new T.PlaneGeometry(TW-0.6,TD-0.6),mat);surface.rotation.x=-Math.PI/2;surface.position.y=SURF;surface.renderOrder=6;scene.add(surface);}
// ---------- camera controls ----------
const ctl={target:new T.Vector3(0,25,0),tgtGoal:new T.Vector3(0,25,0),az:0,pol:1.42,r:118,azG:0,polG:1.42,rG:118,follow:null,lastUser:-10};
function applyCam(dt){const k=1-Math.exp(-dt*5);ctl.az+=(ctl.azG-ctl.az)*k;ctl.pol+=(ctl.polG-ctl.pol)*k;ctl.r+=(ctl.rG-ctl.r)*k;
  if(ctl.follow){ctl.tgtGoal.copy(ctl.follow.pos);}ctl.target.lerp(ctl.tgtGoal,1-Math.exp(-dt*(ctl.follow?4:3)));
  const sp=Math.sin(ctl.pol);camera.position.set(ctl.target.x+ctl.r*sp*Math.sin(ctl.az),ctl.target.y+ctl.r*Math.cos(ctl.pol),ctl.target.z+ctl.r*sp*Math.cos(ctl.az));
  if(ctl.follow){const cp=camera.position;for(const r of rocks){tmpC.subVectors(cp,r.c);const d=tmpC.length(),rr=r.r*0.85;if(d<rr)cp.addScaledVector(tmpC,(rr-d)/Math.max(d,1e-3));}
    cp.y=Math.max(cp.y,floorY(clamp(cp.x,-HX,HX),clamp(cp.z,-HZ,HZ))+2.5);}
  camera.lookAt(ctl.target);}
const tmpC=new T.Vector3();
let drag=null;const pointers=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,pinch:pointers.size===2?pinchDist():0};cv.classList.add('dragging');});
function pinchDist(){const p=[...pointers.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
cv.addEventListener('pointermove',e=>{if(!drag||!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const d=pinchDist();if(drag.pinch){ctl.rG=clamp(ctl.rG*drag.pinch/d,ctl.follow?8:30,230);}drag.pinch=d;drag.moved=true;return;}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5)drag.moved=true;
  ctl.azG-=dx*0.005;ctl.polG=clamp(ctl.polG-dy*0.004,0.35,1.75);ctl.lastUser=clock.elapsedTime;});
cv.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);cv.classList.remove('dragging');if(drag&&!drag.moved)pick(e);if(!pointers.size)drag=null;});
cv.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();ctl.rG=clamp(ctl.rG*Math.exp(e.deltaY*0.001),ctl.follow?8:30,230);ctl.lastUser=clock.elapsedTime;},{passive:false});
const ray=new T.Raycaster(),ndc=new T.Vector2();
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(bodies,false)[0];if(hit)followFish(hit.object.userData.fish);}
const nameEl=document.getElementById('fishname'),btnBack=document.getElementById('btnBack');
function followFish(f){ctl.follow=f;ctl.rG=Math.max(f.size*2.6,9);ctl.polG=f.sp.bottom?1.0:1.45;nameEl.textContent=f.sp.name;nameEl.classList.add('on');btnBack.hidden=false;ctl.lastUser=-10;}
function overview(){ctl.follow=null;ctl.tgtGoal.set(0,25,0);ctl.rG=fitRadius();ctl.polG=1.42;ctl.azG=Math.round(ctl.azG/(Math.PI*2))*Math.PI*2;nameEl.classList.remove('on');btnBack.hidden=true;}
btnBack.onclick=overview;addEventListener('keydown',e=>{if(e.key==='Escape')overview();});
document.getElementById('btnFeed').onclick=feed;
let night=false,nightK=0;const btnLight=document.getElementById('btnLight');
btnLight.onclick=()=>{night=!night;btnLight.textContent=night?'☀️ День':'🌙 Ночь';};
function fitRadius(){const a=innerWidth/innerHeight;const vf=38*Math.PI/180;const hf=2*Math.atan(Math.tan(vf/2)*a);
  const needW=(TW*1.2)/2/Math.tan(hf/2)+HZ,needH=(TH*1.45)/2/Math.tan(vf/2)+HZ;return clamp(Math.max(needW,needH),60,215);}
ctl.r=ctl.rG=fitRadius();
function onResize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(!ctl.follow)ctl.rG=fitRadius();}
addEventListener('resize',onResize);

// ---------- loop ----------
const clock=new T.Clock();let lastNK=-1;const envMats=new Set();
scene.traverse(o=>{if(o.material&&o.material.envMapIntensity!==undefined){o.material.userData.envBase=o.material.envMapIntensity;envMats.add(o.material);}});
const dayW=new T.Color(0.01,0.05,0.06),nightW=new T.Color(0.004,0.02,0.045);
const sunDay=new T.Color(0xfff4e0),sunNight=new T.Color(0x6f8dff);
function frame(){const dt=Math.min(clock.getDelta(),0.05);const time=clock.elapsedTime;G.uTime.value=time;
  nightK+=((night?1:0)-nightK)*(1-Math.exp(-dt*2));
  sun.intensity=3.2*(1-nightK)+0.35*nightK;sun.color.copy(sunDay).lerp(sunNight,nightK);hemi.intensity=0.9*(1-nightK)+0.12*nightK;fill.intensity=0.5*(1-nightK)+0.08*nightK;bounce.intensity=0.7*(1-nightK)+0.05*nightK;
  G.uCaus.value=1-0.75*nightK;G.uWaterColor.value.copy(dayW).lerp(nightW,nightK);
  window.__led.material.color.setRGB(2.2*(1-nightK)+0.4*nightK,2.2*(1-nightK)+0.6*nightK,2.0*(1-nightK)+2.2*nightK);
  renderer.toneMappingExposure=1.3*(1-nightK)+1.15*nightK;
  if(Math.abs(nightK-lastNK)>0.002){lastNK=nightK;for(const m of envMats)m.envMapIntensity=m.userData.envBase*(1-0.8*nightK);}
  for(const f of fishes)if(f.key==='neon')f.body.material.emissiveIntensity=0.6+1.6*nightK;
  updateFish(dt,time);updateBubbles(dt,time);updateMotes(dt,time);
  for(let i=food.length-1;i>=0;i--){const fd=food[i];if(fd.settled){fd.life=(fd.life||0)+dt;if(fd.life>40){scene.remove(fd.m);food.splice(i,1);}continue;}const m=fd.m;
    m.position.y+=fd.vy*dt;m.position.x+=Math.sin(time*1.5+fd.w)*0.3*dt;m.rotation.x+=dt*0.8;m.rotation.z+=dt*0.5;
    const fy=floorY(m.position.x,m.position.z)+0.15;if(m.position.y<fy){m.position.y=fy;m.rotation.set(-Math.PI/2,0,R(0,6));fd.settled=true;}}
  for(const r of rays){r.rotation.set(0,Math.atan2(camera.position.x-r.position.x,camera.position.z-r.position.z),r.userData.tilt);
    r.material.opacity=r.userData.base*(0.6+0.4*Math.sin(time*0.35+r.userData.ph))*(1-0.85*nightK);}
  surface.material.normalMap.offset.set(time*0.012,time*0.007);
  if(ctl.follow&&clock.elapsedTime-ctl.lastUser>4){const f=ctl.follow;const h=Math.atan2(f.dirPrev.x,f.dirPrev.z)+Math.PI/2;
    let d=h-ctl.azG;d=Math.atan2(Math.sin(d),Math.cos(d));ctl.azG+=d*(1-Math.exp(-dt*0.6));}
  applyCam(dt);renderer.render(scene,camera);}
// warm-up simulation so fish are spread naturally
for(let i=0;i<120;i++){G.uTime.value=i/30;updateFish(1/30,i/30);}
applyCam(1);
renderer.compile(scene,camera);
const STILL=location.hash.includes('still');
if(!STILL)renderer.setAnimationLoop(frame);
requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('loader').classList.add('done');window.__ready=true;}));
window.__aq={scene,ctl,fishes,followFish,feed,setNight:v=>{night=v;nightK=v?1:0;btnLight.textContent=night?'☀️ День':'🌙 Ночь';},overview,step:(n,dt=1/30)=>{for(let i=0;i<n;i++){clock.elapsedTime+=dt;const t=clock.elapsedTime;G.uTime.value=t;updateFish(dt,t);updateBubbles(dt,t);}clock.getDelta();frame();}};
window.__genMs=performance.now();
})();
</script>

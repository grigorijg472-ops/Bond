<!DOCTYPE html>

<head>

<style>
  :root { --accent: #2a62d6; --accent-ink: #2250b0; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --accent: #7ea6ff; --accent-ink: #9dbaff; --on-accent: #08122b; } }
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: 60px minmax(0, 1fr); overflow: hidden; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .app { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: 0; }
  .side { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
  .side-head { padding: 20px 20px 14px; display: grid; gap: 14px; }
  .side-head h1 { font-size: 1.5rem; letter-spacing: -0.03em; }
  .search { position: relative; }
  .search .i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search .input { padding-left: 42px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 14px; border-bottom: 1px solid var(--line); }
  .cat { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: .86rem; font-weight: 500; background: var(--surface); transition: border-color .2s, background-color .2s, opacity .2s; }
  .cat i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .cat:hover { border-color: var(--muted); }
  .cat[aria-pressed="true"] { border-color: color-mix(in srgb, var(--c) 70%, var(--line)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
  .cat[aria-pressed="false"] { opacity: .55; }
  .cat[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
  .list { list-style: none; padding: 8px 12px 20px; margin: 0; overflow-y: auto; display: grid; gap: 4px; align-content: start; overscroll-behavior: contain; }
  .loc { width: 100%; text-align: left; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid transparent; transition: background-color .2s, border-color .2s; }
  .loc:hover { background: var(--surface-2); }
  .loc[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 8%, var(--surface)); border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
  .badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 700; font-size: .9rem; font-family: var(--mono); }
  .loc .t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .loc .t b { font-weight: 600; }
  .loc .t span { font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .loc .d { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .loc .m { display: none; gap: 6px 16px; flex-wrap: wrap; margin-top: 10px; font-size: .85rem; }
  .loc[aria-pressed="true"] .m { display: flex; }
  .loc .m span { display: inline-flex; align-items: center; gap: 6px; }
  .loc .m .i { color: var(--muted); width: 1.1em; height: 1.1em; }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
  .count { font-size: .84rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
  .count button { font-weight: 600; color: var(--accent-ink); min-height: 28px; }

  .stage { position: relative; min-height: 0; min-width: 0; background: var(--bg); }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; outline-offset: -3px; }
  #map.drag { cursor: grabbing; } #map.hit { cursor: pointer; }
  .ctl { position: absolute; top: 16px; right: 16px; display: grid; gap: 8px; }
  .ctl .btn { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; width: 46px; min-height: 46px; padding: 0; }
  .ctl .btn:hover { background: var(--surface-2); }
  .tip { position: absolute; left: 0; top: 0; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: .85rem; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .15s; z-index: 5; }
  .tip.on { opacity: 1; }
  .hint { position: absolute; left: 16px; bottom: 16px; display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); font-size: .82rem; color: var(--muted); pointer-events: none; }

  @media (max-width: 900px) {
    body { overflow: auto; display: block; height: auto; }
    .topbar { position: sticky; top: 0; z-index: 30; height: 60px; }
    .app { display: flex; flex-direction: column-reverse; }
    .stage { height: 56dvh; min-height: 340px; }
    .side { border-right: 0; border-top: 1px solid var(--line); }
    .list { overflow: visible; }
    .hint { display: none; }
  }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IC = { clock: `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path><path d="M12 7v5l3 3"></path></svg>`, users: `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"></path></svg>`, pc: `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10"></path><path d="M7 20h10"></path><path d="M9 16v4"></path><path d="M15 16v4"></path></svg>`, box: `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5"></path><path d="M12 12l8 -4.5"></path><path d="M12 12l0 9"></path><path d="M12 12l-8 -4.5"></path><path d="M16 5.25l-8 4.5"></path></svg>`, lab: `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 3l6 0"></path><path d="M10 9l4 0"></path><path d="M10 3v6l-4 11a.7 .7 0 0 0 .5 1h11a.7 .7 0 0 0 .5 -1l-4 -11v-6"></path></svg>` };
  const CATS = { 'Офис': '#2a62d6', 'Инфраструктура': '#14795a', 'Сервис': '#a35f00', 'Логистика': '#c63a2e', 'R&D': '#6d49c9' };
  const LOCS = [
    { id: 1, name: 'Центральный офис', cat: 'Офис', x: 330, y: 270, desc: 'Главный офис компании. Здесь расположены административные службы и команда разработки.', meta: [['clock', '9:00-18:00'], ['users', '50 человек']] },
    { id: 2, name: 'Технопарк', cat: 'Инфраструктура', x: 640, y: 190, desc: 'Современное здание с лабораториями и вычислительным центром. Ключевой объект инфраструктуры.', meta: [['clock', '24/7'], ['pc', '100+ рабочих мест']] },
    { id: 3, name: 'Клиентский центр', cat: 'Сервис', x: 190, y: 440, desc: 'Место встреч с клиентами. Конференц-залы и переговорные комнаты для обсуждения проектов.', meta: [['clock', '10:00-20:00'], ['users', '20 сотрудников']] },
    { id: 4, name: 'Дистрибуция', cat: 'Логистика', x: 780, y: 440, desc: 'Складской комплекс с системой автоматизированного учёта. Обработка заказов и доставка.', meta: [['clock', '8:00-22:00'], ['box', '500+ заказов в день']] },
    { id: 5, name: 'Инновационный центр', cat: 'R&D', x: 500, y: 360, desc: 'Лаборатория новых технологий. Разработка прототипов и экспериментальных решений.', meta: [['clock', '9:00-21:00'], ['lab', '30 специалистов']] }
  ];
  const W = 1000, H = 700;
  const norm = s => s.toLowerCase().replace(/ё/g, 'е');
  let active = new Set(Object.keys(CATS)), query = '', sel = null, hover = null;

  /* ---------- Список и фильтры ---------- */
  const visible = () => LOCS.filter(l => active.has(l.cat) && (!query || norm(l.name + ' ' + l.desc + ' ' + l.cat).includes(query)));
  function buildChips() {
    const box = $('chips'); box.replaceChildren();
    Object.entries(CATS).forEach(([name, c]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cat'; b.style.setProperty('--c', c); b.setAttribute('aria-pressed', active.has(name));
      b.innerHTML = '<i></i><span></span>'; b.lastChild.textContent = name;
      b.addEventListener('click', () => { active.has(name) ? active.delete(name) : active.add(name); b.setAttribute('aria-pressed', active.has(name)); if (sel && !visible().some(l => l.id === sel)) sel = null; renderList(); draw(); });
      box.appendChild(b);
    });
  }
  function renderList() {
    const list = $('list'), vis = visible(); list.replaceChildren();
    vis.forEach(l => {
      const li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.className = 'loc'; b.style.setProperty('--c', CATS[l.cat]); b.setAttribute('aria-pressed', sel === l.id); b.dataset.id = l.id;
      b.innerHTML = `<span class="badge"></span><span><span class="t"><b></b><span></span></span><span class="d" style="display:block"></span><span class="m"></span></span>`;
      b.querySelector('.badge').textContent = l.id; b.querySelector('b').textContent = l.name; b.querySelector('.t > span').textContent = l.cat; b.querySelector('.d').textContent = l.desc;
      const m = b.querySelector('.m'); l.meta.forEach(([ic, tx]) => { const s = document.createElement('span'); s.innerHTML = IC[ic]; s.append(tx); m.appendChild(s); });
      b.addEventListener('click', () => select(sel === l.id ? null : l.id, true));
      li.appendChild(b); list.appendChild(li);
    });
    if (!vis.length) { const e = document.createElement('li'); e.className = 'empty'; e.textContent = 'Ничего не найдено. Измените запрос или фильтры.'; list.appendChild(e); }
    const off = Object.keys(CATS).length - active.size;
    $('count').replaceChildren(document.createTextNode('Показано ' + vis.length + ' из ' + LOCS.length));
    if (off || query) { const r = document.createElement('button'); r.type = 'button'; r.textContent = 'Сбросить'; r.addEventListener('click', () => { active = new Set(Object.keys(CATS)); query = ''; $('q').value = ''; buildChips(); renderList(); draw(); }); $('count').appendChild(r); }
  }
  $('q').addEventListener('input', e => { query = norm(e.target.value.trim()); if (sel && !visible().some(l => l.id === sel)) sel = null; renderList(); draw(); });

  /* ---------- Тема и мир ---------- */
  const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  const THEME = () => dark()
    ? { land: '#161a18', block: '#1f2522', road: '#2d3531', water: '#15303d', park: '#1c3626', stroke: '#101312', ink: '#eceee9', ring: '#ffffff' }
    : { land: '#ece9df', block: '#e0dccf', road: '#fbfaf5', water: '#b9d3df', park: '#cfdcb9', stroke: '#ffffff', ink: '#16181a', ring: '#16181a' };
  let world = null, theme = THEME();
  function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  const PAD = 300;
  function buildWorld() {
    theme = THEME();
    const S = 1.5, oc = document.createElement('canvas'); oc.width = Math.round((W + PAD * 2) * S); oc.height = Math.round((H + PAD * 2) * S);
    const g = oc.getContext('2d'); g.scale(S, S); g.translate(PAD, PAD);
    g.fillStyle = theme.land; g.fillRect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);
    const r = rng(11);
    g.fillStyle = theme.block;
    for (let x = -PAD; x < W + PAD; x += 50) for (let y = -PAD; y < H + PAD; y += 50) {
      const w = 30 + r() * 12, h = 30 + r() * 12;
      g.beginPath(); g.roundRect ? g.roundRect(x + 6 + r() * 4, y + 6 + r() * 4, w, h, 4) : g.rect(x + 8, y + 8, w, h); g.fill();
    }
    g.fillStyle = theme.park;
    [[140, 150, 90, 56], [880, 330, 64, 90], [430, 590, 110, 46], [560, 80, 70, 40], [-180, 420, 110, 70], [1160, 120, 90, 60], [300, -150, 100, 50], [760, 880, 110, 60]].forEach(([cx, cy, rx, ry]) => { g.beginPath(); g.ellipse(cx, cy, rx, ry, 0.2, 0, Math.PI * 2); g.fill(); });
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = theme.water; g.lineWidth = 46; g.beginPath(); g.moveTo(-340, 640); g.bezierCurveTo(-100, 560, 60, 640, 220, 560); g.bezierCurveTo(330, 690, 400, 650, 540, 610); g.bezierCurveTo(760, 530, 860, 650, 1040, 590); g.bezierCurveTo(1160, 560, 1240, 600, 1340, 560); g.stroke();
    g.strokeStyle = theme.road;
    [[-PAD, 120, W + PAD, 120, 10], [-PAD, 330, W + PAD, 330, 12], [-PAD, 500, W + PAD, 500, 9], [-PAD, -90, W + PAD, -90, 8], [-PAD, 800, W + PAD, 800, 8],
     [160, -PAD, 160, H + PAD, 9], [420, -PAD, 420, H + PAD, 12], [700, -PAD, 700, H + PAD, 10], [930, -PAD, 930, H + PAD, 8], [-120, -PAD, -120, H + PAD, 8], [1150, -PAD, 1150, H + PAD, 8]]
      .forEach(([x1, y1, x2, y2, w]) => { g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); });
    world = oc;
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { buildWorld(); draw(); });

  /* ---------- Камера ---------- */
  const cv = $('map'), ctx = cv.getContext('2d');
  let cw = 0, ch = 0, dpr = 1;
  const view = { cx: W / 2, cy: H / 2, s: 1 };
  const MIN = 0.5, MAX = 6;
  const toScreen = (x, y) => [cw / 2 + (x - view.cx) * view.s, ch / 2 + (y - view.cy) * view.s];
  const toWorld = (px, py) => [view.cx + (px - cw / 2) / view.s, view.cy + (py - ch / 2) / view.s];
  function clamp() { view.s = Math.max(MIN, Math.min(MAX, view.s)); view.cx = Math.max(-100, Math.min(W + 100, view.cx)); view.cy = Math.max(-100, Math.min(H + 100, view.cy)); }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = cv.clientWidth; ch = cv.clientHeight; if (!cw || !ch) return;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  function fitTo(list, animate) {
    const pts = (list && list.length ? list : LOCS);
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 110, s = Math.min(cw / (maxX - minX + pad * 2), ch / (maxY - minY + pad * 2), 2.2);
    fly({ cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, s }, animate);
  }
  let anim = 0;
  function fly(t, animate = true) {
    cancelAnimationFrame(anim);
    const a = { ...view }, t0 = performance.now(), dur = reduce || !animate ? 0 : 650;
    const step = now => {
      const k = dur ? Math.min((now - t0) / dur, 1) : 1, e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      view.cx = a.cx + (t.cx - a.cx) * e; view.cy = a.cy + (t.cy - a.cy) * e; view.s = a.s * Math.pow(t.s / a.s, e);
      clamp(); draw(); if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  function zoomAt(px, py, f) {
    const [wx, wy] = toWorld(px, py); view.s = Math.max(MIN, Math.min(MAX, view.s * f));
    view.cx = wx - (px - cw / 2) / view.s; view.cy = wy - (py - ch / 2) / view.s; clamp(); draw();
  }

  /* ---------- Отрисовка ---------- */
  let queued = false;
  function draw() { if (!queued) { queued = true; requestAnimationFrame(render); } }
  function render() {
    queued = false; if (!cw || !world) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = theme.land; ctx.fillRect(0, 0, cw, ch);
    const [ox, oy] = toScreen(-PAD, -PAD);

  /* ---------- Выбор ---------- */
  function select(id, fromList) {

    const k = e.key, st = 70 / view.s; let used = true;

  });

  $('zin').addEventListener('click', () => zoomAt(cw / 2, ch / 2, 1.4)); $('zout').addEventListener('click', () => zoomAt(cw / 2, ch / 2, 1 / 1.4));
  $('fit').addEventListener('click', () => { sel = null; renderList(); fitTo(visible(), true); });

  /* ---------- Запуск ---------- */
  buildChips(); renderList(); buildWorld();
  new ResizeObserver(() => { resize(); if (!view.init) { view.init = true; fitTo(LOCS, false); } draw(); }).observe(cv);
  resize(); if (cw) { view.init = true; fitTo(LOCS, false); } draw();
})();

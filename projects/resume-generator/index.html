<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume Generator: резюме с живым предпросмотром и экспортом в PDF</title>
<meta name="description" content="Заполните форму, выберите шаблон и цвет, сохраните резюме в PDF. Данные остаются в вашем браузере.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --accent: #0f766e; --accent-ink: #0c5f58; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --accent: #4fd1c5; --accent-ink: #7fe3da; --on-accent: #052421; } }
  .page { max-width: 1280px; margin: 0 auto; padding: 8px clamp(16px, 3vw, 40px) 72px; }
  .head { padding: clamp(8px, 3vh, 28px) 0 28px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; }
  .head h1 { font-size: clamp(2rem, 4vw, 2.9rem); font-weight: 700; letter-spacing: -0.04em; max-width: 24ch; }
  .head p { color: var(--muted); max-width: 26rem; }
  .app { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(18px, 2.4vw, 28px); display: grid; gap: 28px; }
  fieldset { border: 0; padding: 0; min-width: 0; display: grid; gap: 14px; }
  legend { padding: 0; margin-bottom: 14px; font-weight: 700; font-size: 1.02rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
  .seg span { display: grid; place-items: center; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; font-weight: 600; background: var(--bg); transition: border-color .2s, background-color .2s; }
  .seg input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches label { position: relative; width: 44px; height: 44px; }
  .swatches input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .swatches span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--c); border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); transition: box-shadow .2s, transform .15s; }
  .swatches input:checked + span { box-shadow: 0 0 0 2.5px var(--ink); }
  .swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
  .swatches label:active span { transform: scale(.92); }
  .jobs { display: grid; gap: 12px; }
  .job { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
  .job .top { display: flex; justify-content: space-between; align-items: center; }
  .job .top b { font-size: .84rem; color: var(--muted); }
  .job .rm { width: 40px; height: 40px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
  .job .rm:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .job .input, .job .textarea { background: var(--surface); }
  .addrow { justify-content: center; border: 1.5px dashed var(--line); color: var(--muted); min-height: 46px; border-radius: 12px; }
  .addrow:hover { border-color: var(--accent); color: var(--accent-ink); }

  .out { position: sticky; top: 12px; display: grid; gap: 14px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .bar .ttl { font-weight: 600; color: var(--muted); font-size: .9rem; }
  .bar .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .sheetwrap { overflow: auto; border-radius: 16px; background: var(--surface-2); padding: clamp(10px, 2vw, 24px); max-height: calc(100dvh - 130px); }
  .sheet { --a: #0f766e; background: #fff; color: #1b1d20; max-width: 760px; margin: 0 auto; min-height: 1000px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 40px rgba(0,0,0,.12); font-size: 13.5px; line-height: 1.5; border-radius: 4px; overflow: hidden; }
  .sheet h1, .sheet h2, .sheet h3, .sheet p, .sheet ul { margin: 0; }
  .sheet .name { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; overflow-wrap: anywhere; }
  .sheet .role { color: var(--a); font-weight: 600; font-size: 1.1rem; margin-top: 4px; }
  .sheet .sec { margin-top: 22px; }
  .sheet .sec > h3 { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--a); font-weight: 700; margin-bottom: 8px; }
  .sheet .job2 { margin-top: 12px; }
  .sheet .job2:first-of-type { margin-top: 0; }
  .sheet .j-top { display: flex; justify-content: space-between; gap: 12px; }
  .sheet .j-top b { font-weight: 600; overflow-wrap: anywhere; }
  .sheet .j-top span { color: #666b72; white-space: nowrap; font-size: .92em; }
  .sheet .j-sub { color: #555a61; }
  .sheet ul { padding-left: 18px; margin-top: 4px; display: grid; gap: 2px; }
  .sheet .muted { color: #8b9097; }
  .sheet .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .sheet .tags span { padding: 3px 10px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--a) 40%, #fff); background: color-mix(in srgb, var(--a) 8%, #fff); font-size: .92em; }
  .sheet .ct { display: grid; gap: 3px; overflow-wrap: anywhere; }
  .sheet .about { white-space: pre-line; overflow-wrap: anywhere; }
  /* Классика */
  .t-classic { padding: clamp(24px, 4vw, 48px); }
  .t-classic .hd { padding-bottom: 18px; border-bottom: 3px solid var(--a); }
  .t-classic .ct { margin-top: 12px; grid-auto-flow: column; justify-content: start; gap: 4px 20px; flex-wrap: wrap; color: #50555c; }
  .t-classic .ct { display: flex; flex-wrap: wrap; }
  /* Боковая колонка */
  .t-side { display: grid; grid-template-columns: 236px 1fr; }
  .t-side .side { background: var(--a); color: #fff; padding: 36px 20px; }
  .t-side .side h3 { color: rgba(255,255,255,.8) !important; }
  .t-side .side .tags span { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: #fff; }
  .t-side .main { padding: 36px 30px; }
  .t-side .name { font-size: 1.9rem; }
  .t-side .role { color: #50555c; }
  .t-side .hd-side { margin-bottom: 24px; }
  .t-side .ct { color: #fff; font-size: .88em; }
  .t-classic .side { display: contents; }
  .live { min-height: 1.3em; font-size: .85rem; color: var(--muted); }

  @media (max-width: 980px) { .app { grid-template-columns: 1fr; } .out { position: static; } .sheetwrap { max-height: none; } }
  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr; }
    .t-side { grid-template-columns: 1fr; }
    .sheet { font-size: 13px; min-height: 0; }
  }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .topbar, .head, .panel, .bar, .live { display: none !important; }
    .page { padding: 0; max-width: none; } .app { display: block; } .out { position: static; }
    .sheetwrap { padding: 0; background: none; overflow: visible; max-height: none; }
    .sheet { box-shadow: none; max-width: none; border-radius: 0; min-height: 297mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .t-classic { padding: 16mm; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../../index.html#projects" aria-label="Портфолио"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12l14 0"></path><path d="M5 12l6 6"></path><path d="M5 12l6 -6"></path></svg><span>Портфолио</span></a>
  <span class="name">Resume Generator</span>
  <a class="write" href="https://t.me/Bond8848" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4"></path></svg><span>Написать</span></a>
</header>

<main class="page">
  <div class="head">
    <h1>Резюме с живым предпросмотром</h1>
    <p>Заполните форму, выберите шаблон и цвет, сохраните в PDF. Данные остаются в вашем браузере.</p>
  </div>

  <div class="app">
    <form class="panel" id="form" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend>Оформление</legend>
        <div class="seg" role="radiogroup" aria-label="Шаблон">
          <label><input type="radio" name="tpl" value="classic"><span>Классика</span></label>
          <label><input type="radio" name="tpl" value="side"><span>С боковой колонкой</span></label>
        </div>
        <div class="swatches" role="radiogroup" aria-label="Цвет">
          <label><input type="radio" name="clr" value="#0f766e" aria-label="Бирюзовый"><span style="--c:#0f766e"></span></label>
          <label><input type="radio" name="clr" value="#1f4fd8" aria-label="Синий"><span style="--c:#1f4fd8"></span></label>
          <label><input type="radio" name="clr" value="#9f1d3a" aria-label="Бордовый"><span style="--c:#9f1d3a"></span></label>
          <label><input type="radio" name="clr" value="#4d6b1f" aria-label="Оливковый"><span style="--c:#4d6b1f"></span></label>
          <label><input type="radio" name="clr" value="#2a2d33" aria-label="Графитовый"><span style="--c:#2a2d33"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Основное</legend>
        <div class="field"><label for="name">ФИО</label><input class="input" id="name" type="text" placeholder="Иванов Иван Иванович"></div>
        <div class="field"><label for="role">Должность</label><input class="input" id="role" type="text" placeholder="Веб-разработчик"></div>
        <div class="row">
          <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" placeholder="name@example.com"></div>
          <div class="field"><label for="phone">Телефон</label><input class="input" id="phone" type="tel" placeholder="+7 999 000-00-00"></div>
        </div>
        <div class="field"><label for="link">Telegram или ссылка</label><input class="input" id="link" type="text" placeholder="@username"></div>
        <div class="field"><label for="about">О себе</label><textarea class="textarea" id="about" rows="4" placeholder="Коротко об опыте и целях"></textarea></div>
      </fieldset>

      <fieldset>
        <legend>Опыт работы</legend>
        <div class="jobs" id="jobs"></div>
        <button class="btn addrow" id="addJob" type="button"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>Добавить место работы</button>
      </fieldset>

      <fieldset>
        <legend>Образование</legend>
        <div class="row">
          <div class="field"><label for="school">Учебное заведение</label><input class="input" id="school" type="text"></div>
          <div class="field"><label for="years">Годы</label><input class="input" id="years" type="text" placeholder="2018-2022"></div>
        </div>
        <div class="field"><label for="field">Специальность</label><input class="input" id="field" type="text"></div>
      </fieldset>

      <fieldset>
        <legend>Навыки</legend>
        <div class="field"><label for="skills">Через запятую</label><input class="input" id="skills" type="text" placeholder="HTML, CSS, JavaScript"><p class="help">Каждый навык станет отдельной меткой.</p></div>
      </fieldset>
    </form>

    <section class="out" aria-label="Предпросмотр">
      <div class="bar">
        <span class="ttl">Предпросмотр</span>
        <div class="acts">
          <button class="btn btn-ghost btn-sm" id="example" type="button"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"></path><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path></svg>Пример</button>
          <button class="btn btn-ghost btn-sm" id="clear" type="button"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 20h-10.5l-4.21 -4.3a1 1 0 0 1 0 -1.41l10 -10a1 1 0 0 1 1.41 0l5 5a1 1 0 0 1 0 1.41l-9.2 9.3"></path><path d="M18 13.3l-6.3 -6.3"></path></svg>Очистить</button>
          <button class="btn btn-primary btn-sm" id="print" type="button"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"></path><path d="M7 11l5 5l5 -5"></path><path d="M12 4l0 12"></path></svg>Скачать PDF</button>
        </div>
      </div>
      <p class="live" id="live" role="status"></p>
      <div class="sheetwrap"><article class="sheet t-classic" id="sheet"></article></div>
    </section>
  </div>
</main>

<script>
(() => {
  const KEY = 'resume.v2', $ = id => document.getElementById(id);
  const RM = `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg>`;
  const EXAMPLE = {
    tpl: 'classic', clr: '#0f766e',
    name: 'Алексей Морозов', role: 'Frontend-разработчик', email: 'alexey.morozov@example.com', phone: '+7 999 123-45-67', link: '@alexey_dev',
    about: 'Пять лет делаю интерфейсы для сервисов и интернет-магазинов. Люблю быстрые страницы, аккуратную вёрстку и понятный код.',
    jobs: [
      { t: 'Senior Frontend-разработчик', c: 'Студия «Пиксель», Москва', p: '2022 - настоящее время', d: 'Перевёл каталог с jQuery на React, время загрузки упало с 4 до 1,5 секунды\nВвёл дизайн-систему и ревью компонентов в команде из 8 человек' },
      { t: 'Frontend-разработчик', c: 'Интернет-магазин «Сезон», Казань', p: '2020 - 2022', d: 'Сверстал адаптивные шаблоны под 12 лендингов\nНастроил сборку на Webpack и автотесты' }
    ],
    school: 'КФУ, Казань', years: '2015-2019', field: 'Прикладная информатика', skills: 'HTML, CSS, JavaScript, TypeScript, React, Node.js, Git, Figma'
  };
  const EMPTY = { tpl: 'classic', clr: '#0f766e', name: '', role: '', email: '', phone: '', link: '', about: '', jobs: [{ t: '', c: '', p: '', d: '' }], school: '', years: '', field: '', skills: '' };
  const clone = o => JSON.parse(JSON.stringify(o));
  let st; try { st = Object.assign(clone(EXAMPLE), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { st = clone(EXAMPLE); }
  if (!Array.isArray(st.jobs)) st.jobs = clone(EXAMPLE.jobs);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  const simple = ['name', 'role', 'email', 'phone', 'link', 'about', 'school', 'years', 'field', 'skills'];
  simple.forEach(id => $(id).addEventListener('input', () => { st[id] = $(id).value; save(); paint(); }));
  document.querySelectorAll('input[name=tpl]').forEach(r => r.addEventListener('change', () => { st.tpl = r.value; save(); paint(); }));
  document.querySelectorAll('input[name=clr]').forEach(r => r.addEventListener('change', () => { st.clr = r.value; save(); paint(); }));

  function fillForm() {
    simple.forEach(id => $(id).value = st[id] || '');
    document.querySelectorAll('input[name=tpl]').forEach(r => r.checked = r.value === st.tpl);
    document.querySelectorAll('input[name=clr]').forEach(r => r.checked = r.value === st.clr);
    jobs();
  }
  function jobs() {
    const box = $('jobs'); box.replaceChildren();
    st.jobs.forEach((j, i) => {
      const el = document.createElement('div'); el.className = 'job';
      el.innerHTML = `<div class="top"><b>Место работы ${i + 1}</b><button class="rm" type="button" aria-label="Удалить место работы ${i + 1}">${RM}</button></div>
        <div class="field"><label>Должность</label><input class="input t" type="text"></div>
        <div class="row"><div class="field"><label>Компания</label><input class="input c" type="text"></div><div class="field"><label>Период</label><input class="input p" type="text" placeholder="2022 - настоящее время"></div></div>
        <div class="field"><label>Что делали (каждая строка станет пунктом)</label><textarea class="textarea d" rows="3"></textarea></div>`;
      [['t', 't'], ['c', 'c'], ['p', 'p'], ['d', 'd']].forEach(([cls, k]) => { const f = el.querySelector('.' + cls); f.value = j[k] || ''; f.addEventListener('input', () => { j[k] = f.value; save(); paint(); }); });
      el.querySelector('.rm').addEventListener('click', () => { if (st.jobs.length === 1) st.jobs[0] = { t: '', c: '', p: '', d: '' }; else st.jobs.splice(i, 1); save(); jobs(); paint(); });
      box.appendChild(el);
    });
  }
  $('addJob').addEventListener('click', () => { st.jobs.push({ t: '', c: '', p: '', d: '' }); save(); jobs(); paint(); const t = $('jobs').querySelectorAll('.t'); t[t.length - 1].focus(); });

  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const sec = (title, ...kids) => { const s = h('section', 'sec'); s.appendChild(h('h3', null, title)); kids.forEach(k => s.appendChild(k)); return s; };

  function paint() {
    const sh = $('sheet'); sh.className = 'sheet ' + (st.tpl === 'side' ? 't-side' : 't-classic'); sh.style.setProperty('--a', st.clr || '#0f766e');
    sh.replaceChildren();
    const contacts = [st.email, st.phone, st.link].filter(Boolean);
    const ct = h('div', 'ct'); contacts.forEach(c => ct.appendChild(h('span', null, c)));

    const head = h('header', 'hd');
    head.appendChild(h('h1', 'name' + (st.name ? '' : ' muted'), st.name || 'Ваше имя'));
    head.appendChild(h('p', 'role' + (st.role ? '' : ' muted'), st.role || 'Должность'));

    const main = h('div', 'main');
    if (st.about.trim()) main.appendChild(sec('Обо мне', h('p', 'about', st.about)));
    const filled = st.jobs.filter(j => j.t || j.c || j.d || j.p);
    if (filled.length) {
      const s = sec('Опыт работы');
      filled.forEach(j => {
        const b = h('div', 'job2'), top = h('div', 'j-top'); top.appendChild(h('b', null, j.t || 'Должность')); if (j.p) top.appendChild(h('span', null, j.p)); b.appendChild(top);
        if (j.c) b.appendChild(h('p', 'j-sub', j.c));
        const lines = j.d.split('\n').map(x => x.replace(/^[\s\-•*]+/, '').trim()).filter(Boolean);
        if (lines.length) { const ul = h('ul'); lines.forEach(l => ul.appendChild(h('li', null, l))); b.appendChild(ul); }
        s.appendChild(b);
      });
      main.appendChild(s);
    }
    if (st.school || st.field || st.years) {
      const b = h('div', 'job2'), top = h('div', 'j-top'); top.appendChild(h('b', null, st.school || 'Учебное заведение')); if (st.years) top.appendChild(h('span', null, st.years)); b.appendChild(top);
      if (st.field) b.appendChild(h('p', 'j-sub', st.field));
      main.appendChild(sec('Образование', b));
    }
    const skills = st.skills.split(',').map(s => s.trim()).filter(Boolean);
    const skillBox = h('div', 'tags'); skills.forEach(k => skillBox.appendChild(h('span', null, k)));

    if (st.tpl === 'side') {
      const side = h('aside', 'side');
      const hs = h('div', 'hd-side'); hs.appendChild(head.querySelector('h1').cloneNode(true)); side.appendChild(hs);
      const rl = head.querySelector('p').cloneNode(true); rl.style.color = 'rgba(255,255,255,.85)'; hs.appendChild(rl);
      if (contacts.length) side.appendChild(sec('Контакты', ct));
      if (skills.length) side.appendChild(sec('Навыки', skillBox));
      sh.append(side, main);
    } else {
      head.appendChild(ct); sh.appendChild(head);
      sh.appendChild(Object.assign(main, { className: 'main' }));
      if (skills.length) main.appendChild(sec('Навыки', skillBox));
    }
  }

  function say(m) { $('live').textContent = m; clearTimeout(say.t); say.t = setTimeout(() => $('live').textContent = '', 2500); }
  $('print').addEventListener('click', () => { say('В окне печати выберите «Сохранить как PDF»'); setTimeout(() => window.print(), 50); });
  $('example').addEventListener('click', () => { st = clone(EXAMPLE); save(); fillForm(); paint(); say('Подставлен пример'); });
  $('clear').addEventListener('click', () => { st = Object.assign(clone(EMPTY), { tpl: st.tpl, clr: st.clr }); save(); fillForm(); paint(); say('Форма очищена'); $('name').focus(); });

  fillForm(); paint();
})();
</script>

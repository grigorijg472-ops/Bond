  .hint { position: fixed; z-index: 12; right: clamp(20px, 6vw, 96px); top: 76px; display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); pointer-events: none; }

  @media (max-width: 760px) {

  @media (prefers-reduced-motion: reduce) { .hero > * { opacity: 1; transform: none; animation: none; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  const chipsWrap = document.getElementById('chips');
  const chips = [...chipsWrap.querySelectorAll('.chip')];
  const caption = document.getElementById('caption');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const skills = [
    { t: 'HTML / CSS', d: 'Адаптивная вёрстка, анимации, доступность', p: [10, -5, 5], c: '#ff8a5c' },
    { t: 'JavaScript', d: 'Интерактивные интерфейсы без лишних библиотек', p: [-8, 8, -5], c: '#ffd166' },
    { t: 'React', d: 'Компонентные приложения и SPA', p: [5, 10, -8], c: '#6ec8ff' },
    { t: 'Python', d: 'Парсеры и автоматизация', p: [-10, -8, 5], c: '#7ee0a1' },
    { t: 'Three.js', d: '3D-сцены, шейдеры и частицы в браузере', p: [0, 1, 11], c: '#ffa94d' }
  ];

  function showCaption(i) {
    chips.forEach((c, k) => c.classList.toggle('on', k === i));
    caption.innerHTML = i == null ? '' : '<b></b><span></span>';
    if (i != null) { caption.firstChild.textContent = skills[i].t; caption.lastChild.textContent = skills[i].d; }
  }

  if (!window.THREE) { document.body.classList.add('no-webgl'); chips.forEach(c => c.hidden = true); return; }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { document.body.classList.add('no-webgl'); chips.forEach(c => c.hidden = true); return; }

  const small = () => innerWidth < 760;
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small() ? 1.5 : 2));
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
  camera.position.z = 38;

  const world = new THREE.Group();     // всё, что вращается
  const anchor = new THREE.Group();    // смещение относительно текста
  anchor.add(world); scene.add(anchor);

  // Частицы: оболочка вокруг сферы
  const N = small() ? 1600 : 3200;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const cA = new THREE.Color('#cfe3ff'), cB = new THREE.Color('#ffa94d');
  for (let i = 0; i < N; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const r = 17 + Math.pow(Math.random(), 1.6) * 16;
    const x = r * Math.sin(ph) * Math.cos(th), y = r * Math.sin(ph) * Math.sin(th), z = r * Math.cos(ph);
    pos.set([x, y, z], i * 3);
    const m = Math.min(Math.max((r - 17) / 16, 0), 1);
    col.set([cA.r + (cB.r - cA.r) * m, cA.g + (cB.g - cA.g) * m, cA.b + (cB.b - cA.b) * m], i * 3);
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(pg, new THREE.PointsMaterial({ size: 0.34, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
  world.add(points);

  // Каркасная сфера
  const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(9, 2), new THREE.MeshBasicMaterial({ color: 0xffa94d, wireframe: true, transparent: true, opacity: 0.28 }));
  world.add(wire);

  // Ядро со свечением по краю
  const coreMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: 'varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform float time; varying vec3 vN; void main(){ float f = pow(1.0 - abs(vN.z), 2.2); vec3 c = mix(vec3(1.0,0.62,0.25), vec3(0.8,0.9,1.0), f); gl_FragColor = vec4(c, 0.35 + f * 0.65 + sin(time * 1.6) * 0.05); }',
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(3.4, 48, 48), coreMat);
  world.add(core);

  // Узлы навыков
  const nodes = skills.map(s => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(s.c) }));
    m.position.set(s.p[0] * 1.15, s.p[1] * 1.15, s.p[2] * 1.15);
    world.add(m); return m;
  });

  // Раскладка: сцена справа от текста на широком экране, сверху на узком
  function layout() {
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    if (small()) { camera.position.z = 54; anchor.position.set(0, 9, 0); }
    else { camera.position.z = 40; anchor.position.set(Math.min(11, w / 140), 0, 0); }
    camera.updateProjectionMatrix();
  }
  layout();
  new ResizeObserver(() => { layout(); draw(); }).observe(stage);

  // Управление: перетаскивание с инерцией
  let rx = 0.25, ry = 0, vx = 0, vy = 0, dragging = false, lx = 0, ly = 0, active = null;
  let focus = null, focusIdx = null, arrived = 0; // выбранный навык: целевые углы и время, когда сцена до него доехала
  const release = () => { focus = null; focusIdx = null; if (active === null) showCaption(null); };
  stage.addEventListener('pointerdown', e => { release(); dragging = true; lx = e.clientX; ly = e.clientY; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    vy = dx * 0.006; vx = dy * 0.006; ry += vy; rx = Math.max(-1.2, Math.min(1.2, rx + vx));
  });
  const end = () => { dragging = false; stage.classList.remove('drag'); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  // Угол поворота сферы, при котором узел оказывается строго перед камерой (порядок Эйлера XYZ: R = Rx * Ry)
  function faceAngles(p) {
    const y = Math.atan2(-p.x, p.z), z1 = -p.x * Math.sin(y) + p.z * Math.cos(y);
    return { x: Math.atan2(p.y, z1), y };
  }
  function focusOn(i) {
    focus = faceAngles(nodes[i].position); focusIdx = i; arrived = 0; vx = vy = 0;
    active = i; showCaption(i);
  }
  chips.forEach((c, i) => {
    const hover = () => { active = i; showCaption(i); };
    const leave = () => { active = focusIdx; showCaption(focusIdx); };
    c.addEventListener('pointerenter', hover); c.addEventListener('pointerleave', leave);
    c.addEventListener('focus', hover); c.addEventListener('blur', leave);
    c.addEventListener('click', () => focusOn(i));
  });

  // Самостоятельное вращение не зависит от частоты кадров и работает всегда.
  // При включённом «уменьшить движение» оно просто медленнее, но сцена не замирает.
  const IDLE = reduce ? 0.16 : 0.32; // рад/с: оборот за 20 с (за 40 с при «уменьшить движение»)
  const v = new THREE.Vector3(), t0 = performance.now() / 1000;
  const TAU = Math.PI * 2;
  let last = t0, spin = 1;
  function draw() {
    const now = performance.now() / 1000, t = now - t0, dt = Math.min(0.05, now - last), f = dt * 60; last = now;
    if (!dragging) {
      if (focus) {
        // плавно доворачиваем выбранный навык к камере по кратчайшему пути
        const k = 1 - Math.exp(-dt * 4.5);
        const dy = ((focus.y - ry + Math.PI) % TAU + TAU) % TAU - Math.PI, dx = focus.x - rx;
        ry += dy * k; rx += dx * k; spin = 0;
        if (Math.abs(dy) + Math.abs(dx) < 0.02) { arrived += dt; if (arrived > 4) release(); }
      } else {
        spin += ((active !== null ? 0.15 : 1) - spin) * Math.min(1, 0.1 * f);
        ry += IDLE * spin * dt + vy * 0.9 * f; vy *= Math.pow(0.94, f);
        rx += vx * 0.9 * f; vx *= Math.pow(0.9, f);
        rx += (0.25 + Math.sin(t * 0.45) * 0.12 - rx) * Math.min(1, 0.02 * f);
      }
    }
    world.rotation.set(rx, ry, 0);
    wire.rotation.y = t * 0.22 * (reduce ? 0.5 : 1); wire.rotation.x = t * 0.08 * (reduce ? 0.5 : 1);
    wire.scale.setScalar(reduce ? 1 : 1 + Math.sin(t * 1.6) * 0.03);
    coreMat.uniforms.time.value = t;
    nodes.forEach((n, i) => n.scale.setScalar(active === i || focusIdx === i ? 1.9 : 1));
    renderer.render(scene, camera);

    // Подписи следуют за узлами
    camera.updateMatrixWorld();
    const w = stage.clientWidth, h = stage.clientHeight;
    nodes.forEach((n, i) => {
      n.getWorldPosition(v);
      const depth = -v.clone().applyMatrix4(camera.matrixWorldInverse).z; // расстояние до камеры
      v.project(camera);
      const x = (v.x * 0.5 + 0.5) * w, y = (-v.y * 0.5 + 0.5) * h;
      const near = camera.position.z - 14, far = camera.position.z + 14;
      const o = Math.max(0.18, Math.min(1, 1 - (depth - near) / (far - near) * 0.9));
      const el = chips[i];
      el.style.transform = 'translate(' + (x + 14).toFixed(1) + 'px,' + (y - 18).toFixed(1) + 'px)';
      el.style.opacity = active === i || focusIdx === i ? 1 : o.toFixed(2);
      el.style.zIndex = Math.round((1 - o) * -10);
    });
  }

  let running = false;
  function loop() { if (!running) return; draw(); requestAnimationFrame(loop); }
  function start() { if (running) return; running = true; requestAnimationFrame(loop); }
  function stop() { running = false; }
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  if ('IntersectionObserver' in window) new IntersectionObserver(es => es[0].isIntersecting ? start() : stop()).observe(stage);
  draw(); start();
})();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор стоимости разработки</title>
<style>
:root {
  --bg: #0a0a0b;
  --fg: #fafafa;
  --muted: #71717a;
  --accent: #22d3ee;
  --accent-hover: #06b6d4;
  --card: #18181b;
  --border: #27272a;
  --success: #10b981;
  --warning: #f59e0b;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafafa;
    --fg: #09090b;
    --muted: #71717a;
    --accent: #0891b2;
    --accent-hover: #0e7490;
    --card: #ffffff;
    --border: #e4e4e7;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #fafafa;
  --fg: #09090b;
  --muted: #71717a;
  --accent: #0891b2;
  --accent-hover: #0e7490;
  --card: #ffffff;
  --border: #e4e4e7;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', -apple-system, sans-serif;
  line-height: 1.6;
  padding: 24px;
  min-height: 100vh;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
}
header {
  text-align: center;
  margin-bottom: 48px;
  padding-top: 40px;
}
h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}
.subtitle {
  color: var(--muted);
  font-size: 1.125rem;
}
.calculator {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 32px;
  align-items: start;
}
@media (max-width: 800px) {
  .calculator { grid-template-columns: 1fr; }
}
.form-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
}
.form-group {
  margin-bottom: 28px;
}
.form-group:last-child { margin-bottom: 0; }
label {
  display: block;
  font-weight: 600;
  margin-bottom: 12px;
  font-size: 0.9375rem;
}
.checkbox-group {
  display: grid;
  gap: 12px;
}
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.checkbox-item:hover {
  border-color: var(--accent);
}
.checkbox-item.checked {
  border-color: var(--accent);
  background: rgba(34, 211, 238, 0.05);
}
.checkbox-item input { display: none; }
.checkmark {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.checkbox-item.checked .checkmark {
  background: var(--accent);
  border-color: var(--accent);
}
.checkmark svg {
  opacity: 0;
  transition: opacity 0.2s;
}
.checkbox-item.checked .checkmark svg { opacity: 1; }
.checkbox-label {
  flex: 1;
}
.checkbox-title {
  font-weight: 600;
  font-size: 0.9375rem;
  margin-bottom: 2px;
}
.checkbox-desc {
  font-size: 0.8125rem;
  color: var(--muted);
}
.checkbox-price {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--accent);
  font-size: 0.875rem;
}
.select-wrapper {
  position: relative;
}
select {
  width: 100%;
  padding: 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--fg);
  font-size: 1rem;
  font-family: inherit;
  cursor: pointer;
  appearance: none;
}
.select-wrapper::after {
  content: '▼';
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.75rem;
  color: var(--muted);
  pointer-events: none;
}
select:focus {
  outline: none;
  border-color: var(--accent);
}
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
  position: sticky;
  top: 24px;
}
.result-header {
  text-align: center;
  margin-bottom: 24px;
}
.result-label {
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 8px;
}
.result-total {
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
}
.result-total span {
  font-size: 1.5rem;
  color: var(--muted);
}
.breakdown {
  border-top: 1px solid var(--border);
  padding-top: 20px;
  margin-top: 20px;
}
.breakdown-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.875rem;
}
.breakdown-item span:first-child { color: var(--muted); }
.breakdown-item span:last-child {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
.breakdown-total {
  border-top: 1px solid var(--border);
  margin-top: 12px;
  padding-top: 12px;
  font-weight: 600;
}
.timeline {
  margin-top: 24px;
  padding: 16px;
  background: rgba(34, 211, 238, 0.05);
  border-radius: 12px;
  text-align: center;
}
.timeline-label {
  font-size: 0.8125rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.timeline-value {
  font-weight: 700;
  font-size: 1.125rem;
}
.cta-btn {
  display: block;
  width: 100%;
  padding: 16px;
  margin-top: 24px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  text-decoration: none;
}
.cta-btn:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
}
.note {
  margin-top: 20px;
  padding: 16px;
  background: var(--bg);
  border-radius: 12px;
  font-size: 0.8125rem;
  color: var(--muted);
  text-align: center;
}
.checkbox-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 480px) { body { overflow-x: hidden; } }
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">

<div class="container">
  <header>
    <h1>Калькулятор стоимости</h1>
    <p class="subtitle">Рассчитайте примерную стоимость разработки вашего проекта</p>
  </header>

  <div class="calculator">
    <div class="form-section">
      <div class="form-group">
        <label>Тип проекта</label>
        <div class="select-wrapper">
          <select id="projectType">
            <option value="landing" data-multiplier="1">Лендинг</option>
            <option value="webapp" data-multiplier="2.5">Веб-приложение</option>
            <option value="automation" data-multiplier="2">Скрипт автоматизации</option>
            <option value="ecommerce" data-multiplier="3">Интернет-магазин</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Функционал</label>
        <div class="checkbox-group" id="features">
          <label class="checkbox-item" data-price="15000">
            <input type="checkbox" value="adaptive">
            <div class="checkmark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="checkbox-label">
              <div class="checkbox-title">Адаптивный дизайн</div>
              <div class="checkbox-desc">Корректное отображение на всех устройствах</div>
            </div>
            <div class="checkbox-price">+15 000 ₽</div>
          </label>

          <label class="checkbox-item" data-price="25000">
            <input type="checkbox" value="cms">
            <div class="checkmark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="checkbox-label">
              <div class="checkbox-title">Панель управления</div>
              <div class="checkbox-desc">Возможность редактировать контент</div>
            </div>
            <div class="checkbox-price">+25 000 ₽</div>
          </label>

          <label class="checkbox-item" data-price="30000">
            <input type="checkbox" value="auth">
            <div class="checkmark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="checkbox-label">
              <div class="checkbox-title">Авторизация пользователей</div>
              <div class="checkbox-desc">Регистрация, вход, личный кабинет</div>
            </div>
            <div class="checkbox-price">+30 000 ₽</div>
          </label>

          <label class="checkbox-item" data-price="20000">
            <input type="checkbox" value="api">
            <div class="checkmark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="checkbox-label">
              <div class="checkbox-title">Интеграция с API</div>
              <div class="checkbox-desc">Подключение внешних сервисов</div>
            </div>
            <div class="checkbox-price">+20 000 ₽</div>
          </label>

          <label class="checkbox-item" data-price="35000">
            <input type="checkbox" value="database">
            <div class="checkmark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="checkbox-label">
              <div class="checkbox-title">База данных</div>
              <div class="checkbox-desc">Хранение и обработка данных</div>
            </div>
            <div class="checkbox-price">+35 000 ₽</div>
          </label>

          <label class="checkbox-item" data-price="15000">
            <input type="checkbox" value="seo">
            <div class="checkmark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="checkbox-label">
              <div class="checkbox-title">SEO-оптимизация</div>
              <div class="checkbox-desc">Настройка для поисковых систем</div>
            </div>
            <div class="checkbox-price">+15 000 ₽</div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Срочность</label>
        <div class="select-wrapper">
          <select id="urgency">
            <option value="normal" data-multiplier="1">Стандартные сроки</option>
            <option value="fast" data-multiplier="1.3">Срочно (+30% к стоимости)</option>
            <option value="veryfast" data-multiplier="1.5">Очень срочно (+50% к стоимости)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-header">
        <div class="result-label">Примерная стоимость</div>
        <div class="result-total"><span>от </span><span id="totalPrice">30 000</span><span> ₽</span></div>
      </div>

      <div class="breakdown" id="breakdown">
        <div class="breakdown-item">
          <span>Базовая стоимость</span>
          <span id="basePrice">30 000 ₽</span>
        </div>
      </div>

      <div class="timeline">
        <div class="timeline-label">Примерный срок</div>
        <div class="timeline-value" id="timeline">1–2 недели</div>
      </div>

      <a href="https://t.me/Bond8848" class="cta-btn" target="_blank" rel="noopener">
        Обсудить проект
      </a>

      <div class="note">
        Точная стоимость определяется после проработки технического задания
      </div>
    </div>
  </div>
</div>

<script>
const basePrices = {
  landing: 30000,
  webapp: 80000,
  automation: 50000,
  ecommerce: 120000
};

const timelines = {
  landing: '1–2 недели',
  webapp: '3–6 недель',
  automation: '1–3 недели',
  ecommerce: '4–8 недель'
};

const urgencyMultipliers = {
  normal: 1,
  fast: 1.3,
  veryfast: 1.5
};

const urgencyTimelines = {
  normal: '',
  fast: ' (ускоренный)',
  veryfast: ' (максимально сжатый)'
};

const projectTypeSelect = document.getElementById('projectType');
const urgencySelect = document.getElementById('urgency');
const featuresContainer = document.getElementById('features');
const totalPriceEl = document.getElementById('totalPrice');
const basePriceEl = document.getElementById('basePrice');
const breakdownEl = document.getElementById('breakdown');
const timelineEl = document.getElementById('timeline');

function formatPrice(price) {
  return new Intl.NumberFormat('ru-RU').format(Math.round(price));
}

function calculate() {
  const projectType = projectTypeSelect.value;
  const urgency = urgencySelect.value;
  let basePrice = basePrices[projectType];
  let featuresPrice = 0;

  const checkedItems = featuresContainer.querySelectorAll('.checkbox-item.checked');
  const featuresList = [];

  checkedItems.forEach(item => {
    const price = parseInt(item.dataset.price);
    featuresPrice += price;
    const title = item.querySelector('.checkbox-title').textContent;
    featuresList.push({ title, price });
  });

  const subtotal = basePrice + featuresPrice;
  const urgencyMult = urgencyMultipliers[urgency];
  const total = subtotal * urgencyMult;

  // Update display
  totalPriceEl.textContent = formatPrice(total);
  basePriceEl.textContent = formatPrice(basePrice) + ' ₽';

  // Update breakdown
  let breakdownHTML = `<div class="breakdown-item">
    <span>Базовая стоимость</span>
    <span>${formatPrice(basePrice)} ₽</span>
  </div>`;

  featuresList.forEach(f => {
    breakdownHTML += `<div class="breakdown-item">
      <span>${f.title}</span>
      <span>+${formatPrice(f.price)} ₽</span>
    </div>`;
  });

  if (featuresPrice > 0) {
    breakdownHTML += `<div class="breakdown-item">
      <span>Дополнительный функционал</span>
      <span>+${formatPrice(featuresPrice)} ₽</span>
    </div>`;
  }

  if (urgency !== 'normal') {
    const extraPercent = urgency === 'fast' ? '30%' : '50%';
    const extraAmount = subtotal * (urgencyMult - 1);
    breakdownHTML += `<div class="breakdown-item">
      <span>Срочность (+${extraPercent})</span>
      <span>+${formatPrice(extraAmount)} ₽</span>
    </div>`;
  }

  breakdownHTML += `<div class="breakdown-item breakdown-total">
    <span>Итого</span>
    <span>${formatPrice(total)} ₽</span>
  </div>`;

  breakdownEl.innerHTML = breakdownHTML;

  // Update timeline
  timelineEl.textContent = timelines[projectType] + urgencyTimelines[urgency];
}

// Event listeners
featuresContainer.querySelectorAll('.checkbox-item').forEach(item => {
  item.setAttribute('role', 'checkbox');
  item.setAttribute('tabindex', '0');
  item.setAttribute('aria-checked', item.classList.contains('checked'));
  const toggle = (e) => {
    e.preventDefault();
    item.classList.toggle('checked');
    item.setAttribute('aria-checked', item.classList.contains('checked'));
    calculate();
  };
  item.addEventListener('click', toggle);
  item.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') toggle(e); });
});

projectTypeSelect.addEventListener('change', calculate);
urgencySelect.addEventListener('change', calculate);

// Initial calculation
calculate();
</script>
</body>
</html>
